<script type="text/x-template" id="crm-template">
  <div>
    <section v-if="!authChecked" class="min-h-screen bg-slate-50">
      <div class="grid min-h-screen lg:grid-cols-[minmax(0,1fr)_460px]">
        <div class="hidden bg-slate-950 p-10 text-white lg:flex lg:flex-col lg:justify-between">
          <div class="flex items-center gap-3">
            <div class="flex h-11 w-11 items-center justify-center rounded-lg bg-blue-600 text-lg font-black">MP</div>
            <div>
              <div class="text-sm font-black tracking-wide">MATCHPOINT CRM</div>
              <div class="text-xs text-slate-400">MATCHPOINT TECHNOLOGY CO., LTD.</div>
            </div>
          </div>
          <div>
            <div class="text-sm font-bold uppercase text-blue-300">Sales Operations</div>
            <h1 class="mt-4 max-w-3xl text-5xl font-black leading-tight">Pipeline, collections, and follow-up work in one Google Workspace CRM.</h1>
          </div>
          <div class="text-xs text-slate-500">Google Apps Script · Google Sheets · Google Drive</div>
        </div>

        <div class="flex items-center justify-center p-6">
          <div class="panel w-full max-w-md p-7">
            <div class="mb-6">
              <h1 class="text-2xl font-black text-slate-950">Sign in</h1>
              <p class="mt-2 text-sm text-slate-600">MATCHPOINT CRM</p>
            </div>
            <form class="space-y-4" @submit.prevent="login">
              <label>
                <span class="label">Username</span>
                <input v-model.trim="loginForm.username" class="field" autocomplete="username" type="text">
              </label>
              <label>
                <span class="label">Password</span>
                <input v-model="loginForm.password" class="field" autocomplete="current-password" type="password">
              </label>
              <button type="submit" class="btn btn-primary w-full" :disabled="loading">
                <span v-if="loading" class="spinner border-blue-200 border-t-white"></span>
                <i v-else class="fa-solid fa-right-to-bracket"></i>
                Sign In
              </button>
            </form>

            <div class="mt-6 border-t border-slate-200 pt-5">
              <button type="button" class="btn btn-secondary w-full" @click="showSetup = !showSetup">
                <i class="fa-solid fa-database"></i>
                Database Setup
              </button>
              <form v-if="showSetup" class="mt-4 space-y-3" @submit.prevent="setupDatabase">
                <label>
                  <span class="label">Admin Email</span>
                  <input v-model.trim="setupForm.email" class="field" type="email">
                </label>
                <label>
                  <span class="label">Admin Username</span>
                  <input v-model.trim="setupForm.username" class="field" type="text">
                </label>
                <label>
                  <span class="label">Admin Password</span>
                  <input v-model="setupForm.password" class="field" type="password">
                </label>
                <button type="submit" class="btn btn-primary w-full" :disabled="loading">
                  <i class="fa-solid fa-wrench"></i>
                  Initialize / Upgrade
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section v-else class="app-shell">
      <div v-if="mobileMenuOpen" class="mobile-scrim lg:hidden" @click="mobileMenuOpen = false"></div>
      <aside :class="['sidebar', { open: mobileMenuOpen }]">
        <div class="p-5">
          <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-600 text-white font-black">MP</div>
            <div class="min-w-0">
              <div class="truncate text-sm font-bold text-white">{{ settings.appName || 'MATCHPOINT CRM' }}</div>
              <div class="truncate text-xs text-slate-400">{{ auth.fullName || auth.email }}</div>
            </div>
          </div>
        </div>
        <nav class="max-h-[calc(100vh-88px)] overflow-y-auto px-3 pb-4 space-y-1">
          <button v-for="item in navItems" :key="item.page" type="button" :class="['nav-button', { active: currentPage === item.page }]" @click="navigate(item.page)">
            <i :class="['fa-solid', item.icon, 'w-5 text-center']"></i>
            <span>{{ item.label }}</span>
          </button>
        </nav>
      </aside>

      <main class="min-w-0">
        <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
          <div class="flex min-h-16 items-center justify-between gap-3 px-4 py-3 md:px-6">
            <div class="flex min-w-0 items-center gap-3">
              <button type="button" class="icon-btn lg:hidden" title="Menu" @click="mobileMenuOpen = true">
                <i class="fa-solid fa-bars"></i>
              </button>
              <div class="min-w-0">
                <h1 class="truncate text-lg font-black text-slate-950 md:text-xl">{{ pageTitle }}</h1>
                <p class="truncate text-xs text-slate-500">{{ settings.companyName }}</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="status-pill bg-blue-50 text-blue-700">{{ auth.role }}</span>
              <button type="button" class="icon-btn" title="Refresh" @click="refreshCurrent"><i class="fa-solid fa-rotate-right"></i></button>
              <button type="button" class="icon-btn" title="Sign out" @click="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
            </div>
          </div>
        </header>

        <section class="p-4 md:p-6">
          <div v-if="loading" class="mb-4 flex items-center gap-2 text-sm text-slate-500">
            <span class="spinner"></span>
            Loading
          </div>

          <section v-if="currentPage === 'dashboard'" class="space-y-4">
            <div class="panel p-4">
              <div class="grid gap-3 md:grid-cols-4 xl:grid-cols-6">
                <label><span class="label">From</span><input v-model="dashboardFilters.fromDate" class="field" type="date"></label>
                <label><span class="label">To</span><input v-model="dashboardFilters.toDate" class="field" type="date"></label>
                <label><span class="label">Stage</span><select v-model="dashboardFilters.stage" class="field"><option value="">All</option><option v-for="stage in lookups.pipelineStages" :key="stage.StageCode" :value="stage.StageCode">{{ stage.StageName }}</option></select></label>
                <label><span class="label">Owner</span><select v-model="dashboardFilters.ownerUserId" class="field" :disabled="!permissions.canViewAll"><option value="">All</option><option v-for="user in lookups.users" :key="user.UserID" :value="user.UserID">{{ user.FullName }}</option></select></label>
                <div class="flex items-end gap-2">
                  <button type="button" class="btn btn-primary" @click="loadDashboard"><i class="fa-solid fa-filter"></i>Apply</button>
                  <button type="button" class="btn btn-secondary" @click="resetDashboard"><i class="fa-solid fa-eraser"></i>Clear</button>
                </div>
              </div>
            </div>
            <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-6">
              <div v-for="card in dashboardCards" :key="card.label" class="panel p-4">
                <p class="text-xs font-bold uppercase text-slate-500">{{ card.label }}</p>
                <p class="mt-2 text-2xl font-black text-slate-950">{{ card.value }}</p>
              </div>
            </div>
            <div class="grid gap-4 xl:grid-cols-3">
              <div class="panel p-4">
                <h2 class="text-sm font-black text-slate-900">Pipeline Count</h2>
                <div class="chart-box"><canvas id="pipelineChart"></canvas></div>
              </div>
              <div class="panel p-4">
                <h2 class="text-sm font-black text-slate-900">Pipeline Value</h2>
                <div class="chart-box"><canvas id="valueChart"></canvas></div>
              </div>
              <div class="panel p-4">
                <h2 class="text-sm font-black text-slate-900">Collections</h2>
                <div class="chart-box"><canvas id="collectionChart"></canvas></div>
              </div>
            </div>
            <div class="grid gap-4 xl:grid-cols-2">
              <record-list title="Top Opportunities" :rows="dashboard.topOpportunities" :fields="['OpportunityCode','OpportunityName','Stage','EstimatedValue','ExpectedCloseDate']"></record-list>
              <record-list title="Overdue Invoices" :rows="dashboard.overdueInvoices" :fields="['InvoiceNumber','CustomerID','DueDate','OutstandingAmount','PaymentStatus']"></record-list>
            </div>
          </section>

          <section v-if="currentPage === 'entity'" class="space-y-4">
            <div class="panel p-4">
              <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_150px_auto]">
                <input v-model="entityFilters.query" class="field" type="search" :placeholder="'Search ' + activeSchema.label">
                <select v-model.number="entityFilters.pageSize" class="field" @change="loadEntity(1)">
                  <option :value="25">25 rows</option>
                  <option :value="50">50 rows</option>
                  <option :value="100">100 rows</option>
                </select>
                <div class="flex gap-2">
                  <button type="button" class="btn btn-secondary" @click="loadEntity(1)"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
                  <button v-if="activeSchema.canCreate" type="button" class="btn btn-primary" @click="newRecord"><i class="fa-solid fa-plus"></i>New</button>
                </div>
              </div>
            </div>
            <div class="panel">
              <div class="table-wrap">
                <table>
                  <thead><tr><th v-for="field in tableFields" :key="field">{{ field }}</th><th></th></tr></thead>
                  <tbody>
                    <tr v-for="row in entityRows.items" :key="row[activeSchema.key]">
                      <td v-for="field in tableFields" :key="field">{{ displayValue(row[field]) }}</td>
                      <td class="text-right">
                        <button type="button" class="icon-btn" title="Edit" @click="editRecord(row[activeSchema.key])"><i class="fa-solid fa-pen"></i></button>
                        <button v-if="activeSchema.canDelete" type="button" class="icon-btn text-red-600" title="Delete" @click="removeRecord(row[activeSchema.key])"><i class="fa-solid fa-trash"></i></button>
                      </td>
                    </tr>
                    <tr v-if="!entityRows.items.length"><td :colspan="tableFields.length + 1" class="text-center text-slate-500">No records</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-200 p-3">
                <span class="text-sm text-slate-500">Page {{ entityRows.page }} of {{ entityRows.totalPages }} · {{ entityRows.total }} records</span>
                <div class="flex gap-2">
                  <button type="button" class="btn btn-secondary" :disabled="entityRows.page <= 1" @click="loadEntity(entityRows.page - 1)">Prev</button>
                  <button type="button" class="btn btn-secondary" :disabled="entityRows.page >= entityRows.totalPages" @click="loadEntity(entityRows.page + 1)">Next</button>
                </div>
              </div>
            </div>
          </section>

          <section v-if="currentPage === 'form'" class="panel p-4">
            <form class="space-y-4" @submit.prevent="saveRecord">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <h2 class="text-lg font-black text-slate-950">{{ recordForm[activeSchema.key] ? 'Edit' : 'New' }} {{ activeSchema.label }}</h2>
                <div class="flex gap-2">
                  <button type="button" class="btn btn-secondary" @click="currentPage = 'entity'"><i class="fa-solid fa-xmark"></i>Cancel</button>
                  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i>Save</button>
                </div>
              </div>
              <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                <label v-for="field in editableFields" :key="field">
                  <span class="label">{{ field }} <span v-if="isRequired(field)" class="text-red-600">*</span></span>
                  <select v-if="fieldOptions(field).length" v-model="recordForm[field]" :class="fieldClass(field)">
                    <option value=""></option>
                    <option v-for="option in fieldOptions(field)" :key="option.value" :value="option.value">{{ option.label }}</option>
                  </select>
                  <textarea v-else-if="fieldType(field) === 'textarea'" v-model="recordForm[field]" :class="fieldClass(field)" rows="3"></textarea>
                  <input v-else-if="fieldType(field) === 'checkbox'" v-model="recordForm[field]" class="h-5 w-5" type="checkbox">
                  <input v-else v-model="recordForm[field]" :class="fieldClass(field)" :type="fieldType(field)">
                  <span v-if="fieldError(field)" class="error-text">{{ fieldError(field) }}</span>
                </label>
              </div>
            </form>
          </section>

          <section v-if="currentPage === 'reports'" class="space-y-4">
            <div class="panel p-4">
              <div class="grid gap-3 md:grid-cols-5">
                <label><span class="label">Report</span><select v-model="reportType" class="field"><option value="pipeline">Pipeline</option><option value="collections">Collections</option><option value="activities">Activities</option></select></label>
                <label><span class="label">From</span><input v-model="reportFilters.fromDate" class="field" type="date"></label>
                <label><span class="label">To</span><input v-model="reportFilters.toDate" class="field" type="date"></label>
                <label><span class="label">Search</span><input v-model="reportFilters.query" class="field" type="search"></label>
                <div class="flex items-end gap-2"><button type="button" class="btn btn-primary" @click="loadReport"><i class="fa-solid fa-table"></i>Run</button><button type="button" class="btn btn-secondary" @click="exportReport"><i class="fa-solid fa-file-excel"></i>Export</button></div>
              </div>
            </div>
            <record-list title="Report Results" :rows="report.rows" :fields="report.headers"></record-list>
            <a v-if="lastExport.url" class="font-bold text-blue-700 underline" :href="lastExport.url" target="_blank" rel="noopener">{{ lastExport.fileName }}</a>
          </section>

          <section v-if="currentPage === 'catalogues'" class="space-y-4">
            <div class="panel p-4">
              <div class="flex flex-wrap items-center gap-2">
                <button type="button" class="btn btn-secondary" @click="loadCatalogues"><i class="fa-solid fa-rotate-right"></i>Refresh</button>
                <button v-for="lib in catalogues" :key="lib.LibraryKey" type="button" :class="['btn', activeCatalogue === lib.LibraryKey ? 'btn-primary' : 'btn-secondary']" @click="openCatalogue(lib.LibraryKey)">{{ lib.DisplayName }}</button>
                <span v-if="!catalogues.length" class="text-sm text-slate-500">No catalogue libraries configured. Add rows to the Catalogues sheet (LibraryKey, DisplayName, FolderId).</span>
              </div>
            </div>
            <div v-if="activeCatalogue" class="panel">
              <div class="border-b border-slate-200 p-4"><h2 class="text-sm font-black text-slate-900">{{ catalogueFiles.library.DisplayName || 'Files' }}</h2></div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>File</th><th>Type</th><th>Size</th><th>Updated</th><th></th></tr></thead>
                  <tbody>
                    <tr v-for="file in catalogueFiles.files" :key="file.Url">
                      <td>{{ file.FileName }}</td>
                      <td>{{ file.FileType }}</td>
                      <td>{{ file.SizeLabel }}</td>
                      <td>{{ file.LastUpdated }}</td>
                      <td class="text-right"><a class="font-bold text-blue-700 underline" :href="file.Url" target="_blank" rel="noopener">Open</a></td>
                    </tr>
                    <tr v-if="!catalogueFiles.files.length"><td colspan="5" class="text-center text-slate-500">No files</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <section v-if="currentPage === 'migration'" class="space-y-4">
            <div class="panel p-4">
              <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_220px_auto]">
                <label><span class="label">Source Spreadsheet ID</span><input v-model.trim="migration.sourceSpreadsheetId" class="field" type="text"></label>
                <label><span class="label">Sheet Name</span><input v-model.trim="migration.sourceSheetName" class="field" type="text"></label>
                <div class="flex items-end gap-2"><button type="button" class="btn btn-secondary" @click="previewMigration"><i class="fa-solid fa-eye"></i>Preview</button><button type="button" class="btn btn-primary" @click="importMigration"><i class="fa-solid fa-file-import"></i>Import</button></div>
              </div>
            </div>
            <record-list title="Migration Mapping" :rows="migrationMapping" :fields="['sourceColumn','targetSheet','targetField','rule']"></record-list>
            <pre v-if="migrationResult" class="panel overflow-auto p-4 text-xs">{{ migrationResult }}</pre>
          </section>

          <section v-if="currentPage === 'health'" class="space-y-4">
            <div class="flex gap-2"><button type="button" class="btn btn-primary" @click="loadHealth"><i class="fa-solid fa-heart-pulse"></i>Run Health Check</button><button type="button" class="btn btn-secondary" @click="installTriggers"><i class="fa-solid fa-bell"></i>Install Triggers</button><button type="button" class="btn btn-secondary" @click="removeTriggers"><i class="fa-solid fa-bell-slash"></i>Remove Triggers</button></div>
            <div class="panel p-4"><div class="text-2xl font-black">{{ health.summary.status || 'Not Run' }}</div><div class="text-sm text-slate-500">{{ health.generatedAt }}</div></div>
            <record-list title="Health Checks" :rows="health.checks" :fields="['name','status','message','recommendedAction']"></record-list>
          </section>

          <section v-if="currentPage === 'tests'" class="space-y-4">
            <button type="button" class="btn btn-primary" @click="runTests"><i class="fa-solid fa-vial-circle-check"></i>Run All Tests</button>
            <div class="panel p-4"><div class="text-xl font-black">{{ tests.passed || 0 }} / {{ tests.totalTests || 0 }} Passed</div><div class="text-sm text-slate-500">Failed {{ tests.failed || 0 }} · Duration {{ tests.durationMs || 0 }} ms</div></div>
            <record-list title="Test Results" :rows="tests.tests" :fields="['name','status','durationMs','details']"></record-list>
          </section>

          <section v-if="currentPage === 'settings'" class="space-y-4">
            <button type="button" class="btn btn-primary" @click="loadSettings"><i class="fa-solid fa-rotate-right"></i>Load Settings</button>
            <div class="panel">
              <div class="table-wrap"><table><thead><tr><th>Key</th><th>Value</th><th>Description</th><th></th></tr></thead><tbody><tr v-for="setting in settingsRows" :key="setting.Key"><td class="font-bold">{{ setting.Key }}</td><td><input v-model="setting.Value" class="field"></td><td>{{ setting.Description }}</td><td class="text-right"><button type="button" class="btn btn-secondary" @click="saveSetting(setting)">Save</button></td></tr></tbody></table></div>
            </div>
          </section>

          <section v-if="currentPage === 'users'" class="space-y-4">
            <div class="panel p-4">
              <div class="grid gap-3 md:grid-cols-4">
                <label><span class="label">Email</span><input v-model.trim="userForm.Email" :class="fieldClass('Email')" placeholder="name@example.com"><span v-if="fieldError('Email')" class="error-text">{{ fieldError('Email') }}</span></label>
                <label><span class="label">Username</span><input v-model.trim="userForm.Username" :class="fieldClass('Username')" placeholder="login name"><span v-if="fieldError('Username')" class="error-text">{{ fieldError('Username') }}</span></label>
                <label><span class="label">Role</span><select v-model="userForm.Role" :class="fieldClass('Role')"><option>Admin</option><option>Manager</option><option>Sales</option></select><span v-if="fieldError('Role')" class="error-text">{{ fieldError('Role') }}</span></label>
                <div class="flex items-end gap-2">
                  <button type="button" class="btn btn-primary" @click="saveUser"><i class="fa-solid fa-user-plus"></i>Save Login</button>
                  <button type="button" class="btn btn-secondary" @click="resetUserForm"><i class="fa-solid fa-eraser"></i>Clear</button>
                </div>
                <label><span class="label">Full Name</span><input v-model="userForm.FullName" class="field" placeholder="Full name"></label>
                <label><span class="label">Department</span><input v-model="userForm.Department" class="field" placeholder="Department"></label>
                <label><span class="label">Password</span><input v-model="userForm.Password" :class="fieldClass('Password')" type="password" :placeholder="userForm.UserID ? 'Leave blank to keep current password' : 'Required for new login'"><span v-if="fieldError('Password')" class="error-text">{{ fieldError('Password') }}</span></label>
                <div class="flex flex-col justify-end gap-2 text-sm">
                  <label class="flex items-center gap-2"><input v-model="userForm.IsActive" type="checkbox"> Active</label>
                  <label class="flex items-center gap-2"><input v-model="userForm.MustChangePassword" type="checkbox"> Must change password</label>
                </div>
              </div>
            </div>
            <div class="panel">
              <div class="border-b border-slate-200 p-4"><h2 class="text-sm font-black text-slate-900">Users</h2></div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Email</th><th>Username</th><th>Name</th><th>Role</th><th>Active</th><th>Last Login</th><th></th></tr></thead>
                  <tbody>
                    <tr v-for="person in users" :key="person.Email">
                      <td>{{ person.Email }}</td>
                      <td>{{ person.Username }}</td>
                      <td>{{ person.FullName }}</td>
                      <td>{{ person.Role }}</td>
                      <td>{{ person.IsActive ? 'Yes' : 'No' }}</td>
                      <td>{{ person.LastLoginAt }}</td>
                      <td class="text-right">
                        <button type="button" class="icon-btn" title="Edit user" @click="editUser(person)"><i class="fa-solid fa-pen"></i></button>
                        <button type="button" class="icon-btn text-red-600" title="Deactivate user" @click="deactivateUser(person.Email)"><i class="fa-solid fa-user-slash"></i></button>
                      </td>
                    </tr>
                    <tr v-if="!users.length"><td colspan="7" class="text-center text-slate-500">No records</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <section v-if="currentPage === 'audit'" class="space-y-4">
            <div class="panel p-4"><div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_160px_auto]"><input v-model="auditFilters.query" class="field" type="search"><select v-model.number="auditFilters.pageSize" class="field"><option :value="25">25 rows</option><option :value="50">50 rows</option><option :value="100">100 rows</option></select><button type="button" class="btn btn-primary" @click="loadAudit(1)">Search</button></div></div>
            <record-list title="Audit Logs" :rows="audit.items" :fields="['Timestamp','UserEmail','Action','EntityType','EntityID','Result','ErrorMessage']"></record-list>
          </section>
        </section>
      </main>

      <div v-if="toast" :class="['toast border p-4 text-sm', toast.type === 'error' ? 'border-red-200 bg-red-50 text-red-800' : 'border-green-200 bg-green-50 text-green-800']">
        <div class="font-black">{{ toast.title }}</div>
        <div>{{ toast.message }}</div>
      </div>
    </section>
  </div>
</script>

<script>
const RecordList = {
  props: ['title', 'rows', 'fields'],
  template: `
    <div class="panel">
      <div class="border-b border-slate-200 p-4"><h2 class="text-sm font-black text-slate-900">{{ title }}</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th v-for="field in fields" :key="field">{{ field }}</th></tr></thead>
          <tbody>
            <tr v-for="(row, index) in rows" :key="index"><td v-for="field in fields" :key="field">{{ format(row[field]) }}</td></tr>
            <tr v-if="!rows || !rows.length"><td :colspan="fields && fields.length ? fields.length : 1" class="text-center text-slate-500">No records</td></tr>
          </tbody>
        </table>
      </div>
    </div>`,
  methods: {
    format(value) {
      if (value === null || value === undefined) return '';
      if (typeof value === 'number') return new Intl.NumberFormat('th-TH').format(value);
      if (typeof value === 'boolean') return value ? 'Yes' : 'No';
      return String(value);
    }
  }
};

Vue.createApp({
  components: { RecordList },
  template: '#crm-template',
  data() {
    return {
      loading: false,
      authChecked: false,
      showSetup: false,
      mobileMenuOpen: false,
      sessionToken: localStorage.getItem('mpcrm.session') || '',
      loginForm: { username: '', password: '' },
      setupForm: { email: '', username: 'admin', password: '' },
      auth: {},
      settings: {},
      permissions: {},
      schemas: {},
      lookups: { users: [], pipelineStages: [] },
      currentPage: 'dashboard',
      activeEntity: 'customers',
      entityRows: { items: [], page: 1, pageSize: 25, total: 0, totalPages: 1 },
      entityFilters: { query: '', page: 1, pageSize: 25 },
      recordForm: {},
      fieldErrors: {},
      dashboardFilters: { fromDate: '', toDate: '', stage: '', ownerUserId: '' },
      dashboard: { kpis: {}, pipelineByStage: {}, valueByStage: {}, collectionByMonth: {}, topOpportunities: [], overdueInvoices: [] },
      charts: {},
      reportType: 'pipeline',
      reportFilters: { query: '', fromDate: '', toDate: '' },
      report: { headers: [], rows: [] },
      lastExport: {},
      catalogues: [],
      activeCatalogue: '',
      catalogueFiles: { library: {}, files: [] },
      migration: { sourceSpreadsheetId: '', sourceSheetName: '' },
      migrationMapping: [],
      migrationResult: '',
      health: { summary: {}, checks: [] },
      tests: { tests: [] },
      settingsRows: [],
      users: [],
      userForm: { Email: '', Username: '', FullName: '', Role: 'Sales', Department: '', Password: '', IsActive: true, MustChangePassword: true },
      auditFilters: { query: '', page: 1, pageSize: 25 },
      audit: { items: [] },
      toast: null
    };
  },
  computed: {
    navItems() {
      const entityItems = Object.keys(this.schemas).map(name => ({ page: 'entity:' + name, label: this.schemas[name].label, icon: this.entityIcon(name) }));
      const items = [{ page: 'dashboard', label: 'Dashboard', icon: 'fa-chart-line' }, ...entityItems, { page: 'reports', label: 'Reports', icon: 'fa-file-lines' }, { page: 'catalogues', label: 'Catalogues', icon: 'fa-folder-open' }];
      if (this.permissions.canRunMigration) items.push({ page: 'migration', label: 'Migration', icon: 'fa-file-import' });
      if (this.permissions.canManageSettings) items.push({ page: 'settings', label: 'Settings', icon: 'fa-gear' }, { page: 'health', label: 'System Health', icon: 'fa-heart-pulse' });
      if (this.permissions.canManageUsers) items.push({ page: 'users', label: 'Users', icon: 'fa-users-gear' });
      if (this.permissions.canRunTests) items.push({ page: 'tests', label: 'Tests', icon: 'fa-vial-circle-check' });
      if (this.permissions.canViewAuditLogs) items.push({ page: 'audit', label: 'Audit Logs', icon: 'fa-shield-halved' });
      return items;
    },
    activeSchema() {
      return this.schemas[this.activeEntity] || { label: '', fields: [], key: 'id', required: [], numeric: [], booleans: [], enums: {} };
    },
    pageTitle() {
      if (this.currentPage === 'entity' || this.currentPage === 'form') return this.activeSchema.label;
      const item = this.navItems.find(nav => nav.page === this.currentPage);
      return item ? item.label : 'MATCHPOINT CRM';
    },
    tableFields() {
      const skip = ['CreatedBy', 'UpdatedBy', 'PreviousValue', 'NewValue'];
      return (this.activeSchema.fields || []).filter(field => skip.indexOf(field) === -1).slice(0, 7);
    },
    editableFields() {
      const system = [this.activeSchema.key, 'CreatedAt', 'CreatedBy', 'UpdatedAt', 'UpdatedBy', 'RecordVersion', 'IsDeleted', 'ExternalSourceKey', 'MigrationRunID'];
      return (this.activeSchema.fields || []).filter(field => system.indexOf(field) === -1);
    },
    dashboardCards() {
      const k = this.dashboard.kpis || {};
      return [
        { label: 'Customers', value: this.number(k.customers) },
        { label: 'Opportunities', value: this.number(k.opportunities) },
        { label: 'Pipeline', value: this.money(k.totalPipelineValue) },
        { label: 'Weighted', value: this.money(k.weightedPipelineValue) },
        { label: 'Outstanding', value: this.money(k.outstandingAmount) },
        { label: 'Overdue', value: this.number(k.overdueInvoices) }
      ];
    }
  },
  mounted() {
    if (this.sessionToken) this.init().catch(() => { this.sessionToken = ''; localStorage.removeItem('mpcrm.session'); });
  },
  methods: {
    rawApiCall(method, ...args) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run
          .withSuccessHandler(response => response && response.success ? resolve(response.data) : reject(response || { message: 'Unexpected response.' }))
          .withFailureHandler(error => reject({ message: error && error.message ? error.message : String(error) }));
        runner[method](...args);
      });
    },
    apiCall(method, ...args) {
      return this.rawApiCall(method, this.sessionToken, ...args);
    },
    async rpc(method, ...args) {
      this.loading = true;
      try {
        return await this.apiCall(method, ...args);
      } catch (error) {
        this.handleError(error);
        throw error;
      } finally {
        this.loading = false;
      }
    },
    async login() {
      this.loading = true;
      try {
        const result = await this.rawApiCall('login', this.loginForm.username, this.loginForm.password);
        this.sessionToken = result.sessionToken;
        localStorage.setItem('mpcrm.session', this.sessionToken);
        await this.init();
      } catch (error) {
        this.handleError(error);
      } finally {
        this.loading = false;
      }
    },
    async setupDatabase() {
      this.loading = true;
      try {
        await this.rawApiCall('setupDatabase', this.sessionToken || '', this.setupForm.email, this.setupForm.username, this.setupForm.password);
        this.showToast('success', 'Database Ready', 'Setup completed.');
      } catch (error) {
        this.handleError(error);
      } finally {
        this.loading = false;
      }
    },
    async init() {
      const data = await this.apiCall('getAuthData');
      this.auth = data.user || {};
      this.settings = data.settings || {};
      this.permissions = data.permissions || {};
      this.schemas = data.schemas || {};
      this.lookups = data.lookups || {};
      this.authChecked = true;
      await this.loadDashboard();
    },
    async logout() {
      try { await this.apiCall('logout'); } catch (error) {}
      localStorage.removeItem('mpcrm.session');
      this.sessionToken = '';
      this.authChecked = false;
      this.loginForm.password = '';
    },
    async navigate(page) {
      this.mobileMenuOpen = false;
      this.fieldErrors = {};
      if (page.indexOf('entity:') === 0) {
        this.activeEntity = page.split(':')[1];
        this.currentPage = 'entity';
        await this.loadEntity(1);
        return;
      }
      this.currentPage = page;
      await this.refreshCurrent();
    },
    async refreshCurrent() {
      if (this.currentPage === 'dashboard') return this.loadDashboard();
      if (this.currentPage === 'entity') return this.loadEntity(this.entityRows.page || 1);
      if (this.currentPage === 'reports') return this.loadReport();
      if (this.currentPage === 'catalogues') return this.loadCatalogues();
      if (this.currentPage === 'migration') return this.loadMigrationMapping();
      if (this.currentPage === 'health') return this.loadHealth();
      if (this.currentPage === 'settings') return this.loadSettings();
      if (this.currentPage === 'users') return this.loadUsers();
      if (this.currentPage === 'audit') return this.loadAudit(1);
    },
    async loadDashboard() {
      this.dashboard = await this.rpc('getDashboard', this.dashboardFilters);
      this.$nextTick(() => this.renderCharts());
    },
    resetDashboard() {
      this.dashboardFilters = { fromDate: '', toDate: '', stage: '', ownerUserId: '' };
      this.loadDashboard();
    },
    async loadEntity(page) {
      this.entityFilters.page = page || 1;
      this.entityRows = await this.rpc('listEntity', this.activeEntity, this.entityFilters);
    },
    newRecord() {
      this.recordForm = {};
      this.editableFields.forEach(field => {
        if (field === 'OwnerUserID' || field === 'AssignedToUserID') this.recordForm[field] = this.auth.userId;
        else if (this.fieldType(field) === 'checkbox') this.recordForm[field] = false;
      });
      this.currentPage = 'form';
    },
    async editRecord(id) {
      this.recordForm = await this.rpc('getEntity', this.activeEntity, id);
      this.currentPage = 'form';
    },
    async saveRecord() {
      this.fieldErrors = {};
      const saved = await this.rpc('saveEntity', this.activeEntity, this.recordForm);
      this.recordForm = saved;
      this.showToast('success', 'Saved', 'Record saved.');
      this.currentPage = 'entity';
      await this.loadEntity(this.entityRows.page || 1);
    },
    async removeRecord(id) {
      if (!confirm('Delete this record?')) return;
      await this.rpc('deleteEntity', this.activeEntity, id);
      this.showToast('success', 'Deleted', 'Record deleted.');
      await this.loadEntity(this.entityRows.page || 1);
    },
    async loadReport() {
      this.report = await this.rpc('getReport', this.reportType, this.reportFilters);
    },
    async exportReport() {
      this.lastExport = await this.rpc('exportReportXlsx', this.reportType, this.reportFilters);
      this.showToast('success', 'Export Ready', this.lastExport.fileName || 'Report exported.');
    },
    async loadCatalogues() {
      this.catalogues = await this.rpc('getCatalogues');
      if (this.catalogues.length && !this.activeCatalogue) {
        await this.openCatalogue(this.catalogues[0].LibraryKey);
      }
    },
    async openCatalogue(key) {
      this.activeCatalogue = key;
      this.catalogueFiles = await this.rpc('getCatalogueFiles', key);
    },
    async loadMigrationMapping() {
      this.migrationMapping = await this.rpc('getMigrationMapping');
    },
    async previewMigration() {
      this.migrationResult = JSON.stringify(await this.rpc('previewMigrationFromSpreadsheet', this.migration.sourceSpreadsheetId, this.migration.sourceSheetName), null, 2);
      await this.loadMigrationMapping();
    },
    async importMigration() {
      if (!confirm('Import source rows into CRM?')) return;
      this.migrationResult = JSON.stringify(await this.rpc('importMigrationFromSpreadsheet', this.migration.sourceSpreadsheetId, this.migration.sourceSheetName), null, 2);
    },
    async loadHealth() {
      this.health = await this.rpc('healthCheck');
    },
    async installTriggers() {
      await this.rpc('installTriggers');
      await this.loadHealth();
    },
    async removeTriggers() {
      await this.rpc('removeTriggers');
      await this.loadHealth();
    },
    async runTests() {
      this.tests = await this.rpc('runAllTests');
    },
    async loadSettings() {
      this.settingsRows = await this.rpc('getSettings');
    },
    async saveSetting(setting) {
      await this.rpc('saveSetting', setting.Key, setting.Value);
      this.showToast('success', 'Saved', 'Setting saved.');
    },
    async loadUsers() {
      this.users = await this.rpc('getUsers');
    },
    editUser(person) {
      this.fieldErrors = {};
      this.userForm = Object.assign({}, person, {
        Password: '',
        IsActive: !!person.IsActive,
        MustChangePassword: !!person.MustChangePassword
      });
    },
    resetUserForm() {
      this.fieldErrors = {};
      this.userForm = { Email: '', Username: '', FullName: '', Role: 'Sales', Department: '', Password: '', IsActive: true, MustChangePassword: true };
    },
    async saveUser() {
      await this.rpc('saveUser', this.userForm);
      this.resetUserForm();
      await this.loadUsers();
      await this.init();
      this.showToast('success', 'Saved', 'User saved.');
    },
    async deactivateUser(email) {
      if (!confirm('Deactivate this user?')) return;
      await this.rpc('deleteUser', email);
      await this.loadUsers();
      this.showToast('success', 'Updated', 'User deactivated.');
    },
    async loadAudit(page) {
      this.auditFilters.page = page || 1;
      this.audit = await this.rpc('getAuditLogs', this.auditFilters);
    },
    fieldType(field) {
      if ((this.activeSchema.booleans || []).indexOf(field) !== -1) return 'checkbox';
      if ((this.activeSchema.numeric || []).indexOf(field) !== -1) return 'number';
      if (/Date$|At$/.test(field) && !/CreatedAt|UpdatedAt/.test(field)) return 'date';
      if (/Notes|Description|Terms|Address|Message/.test(field)) return 'textarea';
      return 'text';
    },
    fieldOptions(field) {
      const enums = this.activeSchema.enums || {};
      if (enums[field]) return enums[field].map(value => ({ value, label: this.labelFor(field, value) }));
      if (/UserID$/.test(field) || field === 'ApprovedByUserID') return (this.lookups.users || []).map(user => ({ value: user.UserID, label: user.FullName || user.Email }));
      return [];
    },
    labelFor(field, value) {
      if (field === 'Stage') {
        const stage = (this.lookups.pipelineStages || []).find(item => item.StageCode === value);
        return stage ? stage.StageName : value;
      }
      return value;
    },
    isRequired(field) {
      return (this.activeSchema.required || []).indexOf(field) !== -1;
    },
    fieldError(field) {
      return this.fieldErrors[field] || '';
    },
    fieldClass(field) {
      return ['field', this.fieldErrors[field] ? 'field-error' : ''];
    },
    displayValue(value) {
      if (typeof value === 'number') return this.number(value);
      if (typeof value === 'boolean') return value ? 'Yes' : 'No';
      return value === null || value === undefined ? '' : String(value);
    },
    number(value) {
      return new Intl.NumberFormat('th-TH').format(Number(value || 0));
    },
    money(value) {
      return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', maximumFractionDigits: 0 }).format(Number(value || 0));
    },
    chartData(object) {
      const labels = Object.keys(object || {});
      return { labels: labels.length ? labels : ['No data'], values: labels.length ? labels.map(label => Number(object[label] || 0)) : [0] };
    },
    renderCharts() {
      this.renderChart('pipelineChart', 'bar', this.dashboard.pipelineByStage || {}, 'Count');
      this.renderChart('valueChart', 'bar', this.dashboard.valueByStage || {}, 'Value');
      this.renderChart('collectionChart', 'line', this.dashboard.collectionByMonth || {}, 'Collected');
    },
    renderChart(id, type, source, label) {
      const el = document.getElementById(id);
      if (!el || !window.Chart) return;
      if (this.charts[id]) this.charts[id].destroy();
      const data = this.chartData(source);
      this.charts[id] = new Chart(el, {
        type,
        data: { labels: data.labels, datasets: [{ label, data: data.values, backgroundColor: '#2563eb', borderColor: '#2563eb', borderWidth: 2 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });
    },
    entityIcon(name) {
      const icons = { customers: 'fa-building', contacts: 'fa-address-book', opportunities: 'fa-bullseye', activities: 'fa-list-check', products: 'fa-boxes-stacked', quotations: 'fa-file-signature', salesOrders: 'fa-cart-shopping', invoices: 'fa-file-invoice-dollar', payments: 'fa-money-bill-wave', paymentAllocations: 'fa-share-nodes', notifications: 'fa-bell' };
      return icons[name] || 'fa-table';
    },
    handleError(error) {
      this.fieldErrors = {};
      if (error && error.errors) error.errors.forEach(item => { this.fieldErrors[item.field] = item.message; });
      this.showToast('error', error && error.code ? error.code : 'Error', error && error.message ? error.message : 'Something went wrong.');
    },
    showToast(type, title, message) {
      this.toast = { type, title, message };
      window.setTimeout(() => { this.toast = null; }, 4500);
    }
  }
}).mount('#app');
</script>
