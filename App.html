<script type="text/x-template" id="crm-template">
  <div>
    <section v-if="accessDenied" class="min-h-screen flex items-center justify-center bg-slate-50 p-6">
      <div class="panel max-w-lg w-full p-8 text-center">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-50 text-red-600">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-950">Access Denied</h1>
        <p class="mt-3 text-slate-600">{{ accessDeniedMessage }}</p>
      </div>
    </section>

    <section v-else class="app-shell">
      <div v-if="mobileMenuOpen" class="mobile-scrim lg:hidden" @click="mobileMenuOpen = false"></div>

      <aside :class="['sidebar', { open: mobileMenuOpen }]">
        <div class="p-5">
          <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-600 text-white font-black">MP</div>
            <div class="min-w-0">
              <div class="truncate text-sm font-bold text-white">{{ settings.appName || 'MATCHPOINT CRM' }}</div>
              <div class="truncate text-xs text-slate-400">{{ settings.companyName || 'MATCHPOINT TECHNOLOGY CO., LTD.' }}</div>
            </div>
          </div>
        </div>
        <nav class="px-3 pb-4 space-y-1">
          <button
            v-for="item in navItems"
            :key="item.page"
            type="button"
            :class="['nav-button', { active: currentPage === item.page }]"
            @click="navigate(item.page)"
          >
            <i :class="['fa-solid', item.icon, 'w-5 text-center']"></i>
            <span>{{ item.label }}</span>
          </button>
        </nav>
      </aside>

      <main class="min-w-0">
        <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
          <div class="flex min-h-16 items-center justify-between gap-3 px-4 py-3 md:px-6">
            <div class="flex min-w-0 items-center gap-3">
              <button type="button" class="icon-btn lg:hidden" title="Menu" @click="mobileMenuOpen = true">
                <i class="fa-solid fa-bars"></i>
              </button>
              <div class="min-w-0">
                <h1 class="truncate text-lg font-black text-slate-950 md:text-xl">{{ pageTitle }}</h1>
                <p class="truncate text-xs text-slate-500">{{ settings.companyName }}</p>
              </div>
            </div>
            <div class="flex min-w-0 items-center gap-2">
              <div class="hidden min-w-0 text-right sm:block">
                <div class="truncate text-sm font-bold text-slate-900">{{ auth.email }}</div>
                <div class="text-xs text-slate-500">{{ auth.fullName || auth.department }}</div>
              </div>
              <span class="status-pill bg-blue-50 text-blue-700">{{ auth.role }}</span>
              <button type="button" class="icon-btn" title="Refresh" @click="refreshCurrent">
                <i class="fa-solid fa-rotate-right"></i>
              </button>
            </div>
          </div>
        </header>

        <section class="p-4 md:p-6">
          <div v-if="initialLoading" class="flex min-h-[50vh] items-center justify-center">
            <div class="spinner"></div>
          </div>

          <div v-else class="space-y-4">
            <section v-if="currentPage === 'dashboard'" class="space-y-4">
              <div class="panel p-4">
                <div class="grid gap-3 md:grid-cols-3 xl:grid-cols-6">
                  <label>
                    <span class="label">From</span>
                    <input v-model="dashboardFilters.fromDate" class="field" type="date">
                  </label>
                  <label>
                    <span class="label">To</span>
                    <input v-model="dashboardFilters.toDate" class="field" type="date">
                  </label>
                  <label>
                    <span class="label">Status</span>
                    <select v-model="dashboardFilters.status" class="field">
                      <option value="">All</option>
                      <option v-for="state in workflowStates" :key="state.StateCode" :value="state.StateCode">{{ state.StateName }}</option>
                    </select>
                  </label>
                  <label>
                    <span class="label">Department</span>
                    <input v-model="dashboardFilters.responsibleDept" class="field" type="text">
                  </label>
                  <label>
                    <span class="label">Customer Type</span>
                    <select v-model="dashboardFilters.customerType" class="field">
                      <option value="">All</option>
                      <option v-for="type in customerTypes" :key="type" :value="type">{{ type }}</option>
                    </select>
                  </label>
                  <label>
                    <span class="label">Sales Owner</span>
                    <select v-model="dashboardFilters.salesOwner" class="field" :disabled="!permissions.canViewAll">
                      <option value="">All</option>
                      <option v-for="person in users" :key="person.Email" :value="person.Email">{{ person.FullName || person.Email }}</option>
                    </select>
                  </label>
                </div>
                <div class="mt-3 flex flex-wrap gap-2">
                  <button type="button" class="btn btn-primary" @click="loadDashboard"><i class="fa-solid fa-filter"></i>Apply</button>
                  <button type="button" class="btn btn-secondary" @click="resetDashboardFilters"><i class="fa-solid fa-eraser"></i>Clear</button>
                </div>
              </div>

              <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-6">
                <div v-for="card in dashboardCards" :key="card.label" class="panel p-4">
                  <div class="flex items-center justify-between gap-3">
                    <div>
                      <p class="text-xs font-bold uppercase text-slate-500">{{ card.label }}</p>
                      <p class="mt-2 text-2xl font-black text-slate-950">{{ card.value }}</p>
                    </div>
                    <div :class="['flex h-10 w-10 items-center justify-center rounded-lg', card.className]">
                      <i :class="['fa-solid', card.icon]"></i>
                    </div>
                  </div>
                </div>
              </div>

              <div class="grid gap-4 xl:grid-cols-3">
                <div class="panel p-4">
                  <h2 class="text-sm font-black text-slate-900">Projects by Status</h2>
                  <div class="chart-box"><canvas id="statusCountChart"></canvas></div>
                </div>
                <div class="panel p-4">
                  <h2 class="text-sm font-black text-slate-900">Value by Status</h2>
                  <div class="chart-box"><canvas id="statusValueChart"></canvas></div>
                </div>
                <div class="panel p-4">
                  <h2 class="text-sm font-black text-slate-900">Customer Types</h2>
                  <div class="chart-box"><canvas id="customerTypeChart"></canvas></div>
                </div>
              </div>

              <div class="grid gap-4 xl:grid-cols-2">
                <div class="panel">
                  <div class="border-b border-slate-200 p-4">
                    <h2 class="text-sm font-black text-slate-900">Recent Activity</h2>
                  </div>
                  <div class="table-wrap">
                    <table>
                      <thead><tr><th>Project</th><th>Status</th><th>Value</th><th>Updated</th></tr></thead>
                      <tbody>
                        <tr v-for="project in dashboard.recentProjects" :key="project.ProjectID">
                          <td>
                            <button class="font-bold text-blue-700" type="button" @click="editProject(project.ProjectID)">{{ project.ProjectName }}</button>
                            <div class="text-xs text-slate-500">{{ project.CustomerName }}</div>
                          </td>
                          <td><span :class="statusClass(project.Status)">{{ statusName(project.Status) }}</span></td>
                          <td>{{ money(project.ProjectValue) }}</td>
                          <td>{{ project.UpdatedAt }}</td>
                        </tr>
                        <tr v-if="!dashboard.recentProjects.length"><td colspan="4" class="text-center text-slate-500">No records</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
                <div class="panel">
                  <div class="border-b border-slate-200 p-4">
                    <h2 class="text-sm font-black text-slate-900">Top Project Value</h2>
                  </div>
                  <div class="table-wrap">
                    <table>
                      <thead><tr><th>Project</th><th>Owner</th><th>Status</th><th>Value</th></tr></thead>
                      <tbody>
                        <tr v-for="project in dashboard.topProjectsByValue" :key="project.ProjectID">
                          <td>
                            <button class="font-bold text-blue-700" type="button" @click="editProject(project.ProjectID)">{{ project.ProjectName }}</button>
                            <div class="text-xs text-slate-500">{{ project.CustomerName }}</div>
                          </td>
                          <td>{{ project.AssignedSalesEmail }}</td>
                          <td><span :class="statusClass(project.Status)">{{ statusName(project.Status) }}</span></td>
                          <td>{{ money(project.ProjectValue) }}</td>
                        </tr>
                        <tr v-if="!dashboard.topProjectsByValue.length"><td colspan="4" class="text-center text-slate-500">No records</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </section>

            <section v-if="currentPage === 'customers'" class="space-y-4">
              <div class="panel p-4">
                <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_220px_160px_auto]">
                  <input v-model="customerQuery" class="field" type="search" placeholder="Search customers">
                  <select v-model="customerFilters.customerType" class="field">
                    <option value="">All customer types</option>
                    <option v-for="type in customerTypes" :key="type" :value="type">{{ type }}</option>
                  </select>
                  <select v-model.number="customerPager.pageSize" class="field" @change="loadCustomers(1)">
                    <option :value="10">10 rows</option>
                    <option :value="25">25 rows</option>
                    <option :value="50">50 rows</option>
                    <option :value="100">100 rows</option>
                  </select>
                  <div class="flex gap-2">
                    <button type="button" class="btn btn-secondary" @click="loadCustomers(1)"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
                    <button type="button" class="btn btn-primary" @click="newCustomer"><i class="fa-solid fa-plus"></i>New</button>
                  </div>
                </div>
              </div>
              <div class="panel">
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>ID</th><th>Company</th><th>Contact</th><th>Type</th><th>Owner</th><th></th></tr></thead>
                    <tbody>
                      <tr v-for="customer in customers.items" :key="customer.CustomerID">
                        <td class="font-bold">{{ customer.CustomerID }}</td>
                        <td>
                          <button class="font-bold text-blue-700" type="button" @click="editCustomer(customer.CustomerID)">{{ customer.CompanyName }}</button>
                          <div class="text-xs text-slate-500">{{ customer.Industry }}</div>
                        </td>
                        <td>
                          <div>{{ customer.ContactPerson }}</div>
                          <div class="text-xs text-slate-500">{{ customer.Phone }}</div>
                        </td>
                        <td>{{ customer.CustomerType }}</td>
                        <td>{{ customer.OwnerEmail }}</td>
                        <td class="text-right">
                          <button type="button" class="icon-btn" title="Edit" @click="editCustomer(customer.CustomerID)"><i class="fa-solid fa-pen"></i></button>
                          <button v-if="permissions.canDeleteRecords" type="button" class="icon-btn text-red-600" title="Delete" @click="removeCustomer(customer.CustomerID)"><i class="fa-solid fa-trash"></i></button>
                        </td>
                      </tr>
                      <tr v-if="!customers.items.length"><td colspan="6" class="text-center text-slate-500">No records</td></tr>
                    </tbody>
                  </table>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-200 p-3">
                  <span class="text-sm text-slate-500">Page {{ customers.page }} of {{ customers.totalPages }} · {{ customers.total }} records</span>
                  <div class="flex gap-2">
                    <button type="button" class="btn btn-secondary" :disabled="customers.page <= 1" @click="loadCustomers(customers.page - 1)">Prev</button>
                    <button type="button" class="btn btn-secondary" :disabled="customers.page >= customers.totalPages" @click="loadCustomers(customers.page + 1)">Next</button>
                  </div>
                </div>
              </div>
            </section>

            <section v-if="currentPage === 'customer-form'" class="panel p-4">
              <form class="space-y-4" @submit.prevent="saveCustomerForm">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <h2 class="text-lg font-black text-slate-950">{{ customerForm.CustomerID ? 'Edit Customer' : 'New Customer' }}</h2>
                  <div class="flex gap-2">
                    <button type="button" class="btn btn-secondary" @click="navigate('customers')"><i class="fa-solid fa-xmark"></i>Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i>Save</button>
                  </div>
                </div>
                <div class="grid gap-4 md:grid-cols-2">
                  <label><span class="label">Company Name</span><input v-model="customerForm.CompanyName" :class="fieldClass('CompanyName')" type="text"><span v-if="fieldError('CompanyName')" class="error-text">{{ fieldError('CompanyName') }}</span></label>
                  <label><span class="label">Contact Person</span><input v-model="customerForm.ContactPerson" class="field" type="text"></label>
                  <label><span class="label">Phone</span><input v-model="customerForm.Phone" class="field" type="text"></label>
                  <label><span class="label">Email</span><input v-model="customerForm.Email" :class="fieldClass('Email')" type="email"><span v-if="fieldError('Email')" class="error-text">{{ fieldError('Email') }}</span></label>
                  <label><span class="label">Tax ID</span><input v-model="customerForm.TaxID" class="field" type="text"></label>
                  <label><span class="label">Customer Type</span><select v-model="customerForm.CustomerType" :class="fieldClass('CustomerType')"><option value="">Select</option><option v-for="type in customerTypes" :key="type" :value="type">{{ type }}</option></select><span v-if="fieldError('CustomerType')" class="error-text">{{ fieldError('CustomerType') }}</span></label>
                  <label><span class="label">Industry</span><input v-model="customerForm.Industry" class="field" type="text"></label>
                  <label v-if="permissions.canViewAll"><span class="label">Owner</span><select v-model="customerForm.OwnerEmail" :class="fieldClass('OwnerEmail')"><option value="">Select</option><option v-for="person in users" :key="person.Email" :value="person.Email">{{ person.FullName || person.Email }}</option></select><span v-if="fieldError('OwnerEmail')" class="error-text">{{ fieldError('OwnerEmail') }}</span></label>
                  <label class="md:col-span-2"><span class="label">Address</span><textarea v-model="customerForm.Address" class="field min-h-24"></textarea></label>
                  <label class="md:col-span-2"><span class="label">Notes</span><textarea v-model="customerForm.Notes" class="field min-h-24"></textarea></label>
                </div>
              </form>
            </section>

            <section v-if="currentPage === 'projects'" class="space-y-4">
              <div class="panel p-4">
                <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-[minmax(0,1fr)_220px_180px_180px_auto]">
                  <input v-model="projectFilters.query" class="field" type="search" placeholder="Search projects">
                  <select v-model="projectFilters.status" class="field">
                    <option value="">All statuses</option>
                    <option v-for="state in workflowStates" :key="state.StateCode" :value="state.StateCode">{{ state.StateName }}</option>
                  </select>
                  <input v-model="projectFilters.responsibleDept" class="field" type="text" placeholder="Department">
                  <select v-model.number="projectPager.pageSize" class="field" @change="loadProjects(1)">
                    <option :value="10">10 rows</option>
                    <option :value="25">25 rows</option>
                    <option :value="50">50 rows</option>
                    <option :value="100">100 rows</option>
                  </select>
                  <div class="flex gap-2">
                    <button type="button" class="btn btn-secondary" @click="loadProjects(1)"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
                    <button type="button" class="btn btn-primary" @click="newProject"><i class="fa-solid fa-plus"></i>New</button>
                  </div>
                </div>
              </div>
              <div class="panel">
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>ID</th><th>Project</th><th>Customer</th><th>Status</th><th>Owner</th><th>Value</th><th></th></tr></thead>
                    <tbody>
                      <tr v-for="project in projects.items" :key="project.ProjectID">
                        <td class="font-bold">{{ project.ProjectID }}</td>
                        <td>
                          <button type="button" class="font-bold text-blue-700" @click="editProject(project.ProjectID)">{{ project.ProjectName }}</button>
                          <div class="text-xs text-slate-500">{{ project.ResponsibleDept }}</div>
                        </td>
                        <td>{{ project.CustomerName || project.CustomerID }}</td>
                        <td><span :class="statusClass(project.Status)">{{ statusName(project.Status) }}</span></td>
                        <td>{{ project.AssignedSalesEmail }}</td>
                        <td>{{ money(project.ProjectValue) }}</td>
                        <td class="text-right">
                          <button type="button" class="icon-btn" title="Edit" @click="editProject(project.ProjectID)"><i class="fa-solid fa-pen"></i></button>
                          <button v-if="permissions.canDeleteRecords" type="button" class="icon-btn text-red-600" title="Delete" @click="removeProject(project.ProjectID)"><i class="fa-solid fa-trash"></i></button>
                        </td>
                      </tr>
                      <tr v-if="!projects.items.length"><td colspan="7" class="text-center text-slate-500">No records</td></tr>
                    </tbody>
                  </table>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-200 p-3">
                  <span class="text-sm text-slate-500">Page {{ projects.page }} of {{ projects.totalPages }} · {{ projects.total }} records</span>
                  <div class="flex gap-2">
                    <button type="button" class="btn btn-secondary" :disabled="projects.page <= 1" @click="loadProjects(projects.page - 1)">Prev</button>
                    <button type="button" class="btn btn-secondary" :disabled="projects.page >= projects.totalPages" @click="loadProjects(projects.page + 1)">Next</button>
                  </div>
                </div>
              </div>
            </section>

            <section v-if="currentPage === 'project-form'" class="panel p-4">
              <form class="space-y-4" @submit.prevent="saveProjectForm">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <h2 class="text-lg font-black text-slate-950">{{ projectForm.ProjectID ? 'Edit Project' : 'New Project' }}</h2>
                  <div class="flex gap-2">
                    <button type="button" class="btn btn-secondary" @click="navigate('projects')"><i class="fa-solid fa-xmark"></i>Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i>Save</button>
                  </div>
                </div>
                <div class="grid gap-4 md:grid-cols-2">
                  <label><span class="label">Customer</span><select v-model="projectForm.CustomerID" :class="fieldClass('CustomerID')"><option value="">Select</option><option v-for="customer in customerOptions" :key="customer.CustomerID" :value="customer.CustomerID">{{ customer.CompanyName }} · {{ customer.CustomerID }}</option></select><span v-if="fieldError('CustomerID')" class="error-text">{{ fieldError('CustomerID') }}</span></label>
                  <label><span class="label">Project Name</span><input v-model="projectForm.ProjectName" :class="fieldClass('ProjectName')" type="text"><span v-if="fieldError('ProjectName')" class="error-text">{{ fieldError('ProjectName') }}</span></label>
                  <label><span class="label">Responsible Dept</span><input v-model="projectForm.ResponsibleDept" class="field" type="text"></label>
                  <label><span class="label">Assigned Sales</span><select v-model="projectForm.AssignedSalesEmail" :class="fieldClass('AssignedSalesEmail')" :disabled="!permissions.canViewAll"><option value="">Select</option><option v-for="person in users" :key="person.Email" :value="person.Email">{{ person.FullName || person.Email }}</option></select><span v-if="fieldError('AssignedSalesEmail')" class="error-text">{{ fieldError('AssignedSalesEmail') }}</span></label>
                  <label><span class="label">Project Value</span><input v-model.number="projectForm.ProjectValue" :class="fieldClass('ProjectValue')" type="number" min="0" step="0.01"><span v-if="fieldError('ProjectValue')" class="error-text">{{ fieldError('ProjectValue') }}</span></label>
                  <label><span class="label">Probability</span><input v-model.number="projectForm.Probability" :class="fieldClass('Probability')" type="number" min="0" max="100"><span v-if="fieldError('Probability')" class="error-text">{{ fieldError('Probability') }}</span></label>
                  <label><span class="label">Status</span><select v-model="projectForm.Status" :class="fieldClass('Status')" @change="ensureStatusDetails"><option value="">Select</option><option v-for="state in workflowStates" :key="state.StateCode" :value="state.StateCode">{{ state.StateName }}</option></select><span v-if="fieldError('Status')" class="error-text">{{ fieldError('Status') }}</span></label>
                  <label><span class="label">Expected Close Date</span><input v-model="projectForm.ExpectedCloseDate" class="field" type="date"></label>
                  <label><span class="label">Priority</span><select v-model="projectForm.Priority" :class="fieldClass('Priority')"><option v-for="priority in priorities" :key="priority" :value="priority">{{ priority }}</option></select><span v-if="fieldError('Priority')" class="error-text">{{ fieldError('Priority') }}</span></label>
                  <label class="md:col-span-2"><span class="label">Notes</span><textarea v-model="projectForm.Notes" class="field min-h-24"></textarea></label>
                </div>
                <div v-if="currentStatusFields.length" class="border-t border-slate-200 pt-4">
                  <h3 class="text-sm font-black text-slate-900">Status Details</h3>
                  <div class="mt-3 grid gap-4 md:grid-cols-2">
                    <label v-for="field in currentStatusFields" :key="field.key" :class="{ 'md:col-span-2': field.type === 'textarea' }">
                      <span class="label">{{ field.label }}</span>
                      <select v-if="field.type === 'select'" v-model="projectForm.StatusDetails[field.key]" :class="fieldClass('StatusDetails.' + field.key)">
                        <option value="">Select</option>
                        <option v-for="option in field.options" :key="option" :value="option">{{ option }}</option>
                      </select>
                      <textarea v-else-if="field.type === 'textarea'" v-model="projectForm.StatusDetails[field.key]" :class="fieldClass('StatusDetails.' + field.key)" class="min-h-24"></textarea>
                      <input v-else v-model="projectForm.StatusDetails[field.key]" :class="fieldClass('StatusDetails.' + field.key)" :type="field.type">
                      <span v-if="fieldError('StatusDetails.' + field.key)" class="error-text">{{ fieldError('StatusDetails.' + field.key) }}</span>
                    </label>
                  </div>
                </div>
              </form>
            </section>

            <section v-if="currentPage === 'catalogues'" class="space-y-4">
              <div class="panel p-4">
                <div class="flex flex-wrap gap-2">
                  <button v-for="library in libraries" :key="library.LibraryKey" type="button" :class="['btn', selectedLibrary === library.LibraryKey ? 'btn-primary' : 'btn-secondary']" @click="selectLibrary(library.LibraryKey)">
                    <i class="fa-solid fa-folder-open"></i>{{ library.DisplayName }}
                  </button>
                </div>
              </div>
              <div class="panel">
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>File</th><th>Type</th><th>Category</th><th>Size</th><th>Updated</th><th></th></tr></thead>
                    <tbody>
                      <tr v-for="file in libraryFiles" :key="file.Url">
                        <td class="font-bold">{{ file.FileName }}</td>
                        <td>{{ file.FileType }}</td>
                        <td>{{ file.Category }}</td>
                        <td>{{ file.SizeLabel }}</td>
                        <td>{{ file.LastUpdated }}</td>
                        <td class="text-right"><a class="btn btn-secondary" :href="file.Url" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i>Open</a></td>
                      </tr>
                      <tr v-if="!libraryFiles.length"><td colspan="6" class="text-center text-slate-500">No records</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </section>

            <section v-if="currentPage === 'users'" class="space-y-4">
              <div class="panel p-4">
                <form class="grid gap-3 md:grid-cols-[1fr_160px_1fr_1fr_120px_auto]" @submit.prevent="saveUserForm">
                  <input v-model="userForm.Email" class="field" type="email" placeholder="Email">
                  <select v-model="userForm.Role" class="field"><option>Admin</option><option>Manager</option><option>Sales</option></select>
                  <input v-model="userForm.FullName" class="field" type="text" placeholder="Full name">
                  <input v-model="userForm.Department" class="field" type="text" placeholder="Department">
                  <label class="flex items-center gap-2 text-sm font-bold text-slate-700"><input v-model="userForm.IsActive" type="checkbox"> Active</label>
                  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i>Save</button>
                </form>
              </div>
              <div class="panel">
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>Email</th><th>Role</th><th>Name</th><th>Department</th><th>Active</th><th></th></tr></thead>
                    <tbody>
                      <tr v-for="person in users" :key="person.Email">
                        <td class="font-bold">{{ person.Email }}</td>
                        <td>{{ person.Role }}</td>
                        <td>{{ person.FullName }}</td>
                        <td>{{ person.Department }}</td>
                        <td>{{ person.IsActive ? 'TRUE' : 'FALSE' }}</td>
                        <td class="text-right">
                          <button type="button" class="icon-btn" title="Edit" @click="editUser(person)"><i class="fa-solid fa-pen"></i></button>
                          <button type="button" class="icon-btn text-red-600" title="Deactivate" @click="removeUser(person.Email)"><i class="fa-solid fa-user-slash"></i></button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </section>

            <section v-if="currentPage === 'settings'" class="panel">
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Key</th><th>Value</th><th>Description</th><th></th></tr></thead>
                  <tbody>
                    <tr v-for="setting in settingsRows" :key="setting.Key">
                      <td class="font-bold">{{ setting.Key }}</td>
                      <td><input v-model="setting.Value" class="field" type="text"></td>
                      <td>{{ setting.Description }}</td>
                      <td class="text-right"><button type="button" class="btn btn-primary" @click="saveSettingRow(setting)"><i class="fa-solid fa-floppy-disk"></i>Save</button></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>

            <section v-if="currentPage === 'audit'" class="space-y-4">
              <div class="panel p-4">
                <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_200px_200px_auto]">
                  <input v-model="auditFilters.query" class="field" type="search" placeholder="Search audit">
                  <input v-model="auditFilters.action" class="field" type="text" placeholder="Action">
                  <input v-model="auditFilters.actorEmail" class="field" type="email" placeholder="Actor">
                  <button type="button" class="btn btn-secondary" @click="loadAudit(1)"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
                </div>
              </div>
              <div class="panel">
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Entity</th><th>Context</th></tr></thead>
                    <tbody>
                      <tr v-for="log in audit.items" :key="log.AuditID">
                        <td>{{ log.Timestamp }}</td>
                        <td>{{ log.ActorEmail }}</td>
                        <td class="font-bold">{{ log.Action }}</td>
                        <td>{{ log.EntityType }} · {{ log.EntityID }}</td>
                        <td>{{ log.IpOrContext }}</td>
                      </tr>
                      <tr v-if="!audit.items.length"><td colspan="5" class="text-center text-slate-500">No records</td></tr>
                    </tbody>
                  </table>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-200 p-3">
                  <span class="text-sm text-slate-500">Page {{ audit.page }} of {{ audit.totalPages }} · {{ audit.total }} records</span>
                  <div class="flex gap-2">
                    <button type="button" class="btn btn-secondary" :disabled="audit.page <= 1" @click="loadAudit(audit.page - 1)">Prev</button>
                    <button type="button" class="btn btn-secondary" :disabled="audit.page >= audit.totalPages" @click="loadAudit(audit.page + 1)">Next</button>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </section>
      </main>

      <nav class="fixed bottom-0 left-0 right-0 z-30 grid grid-cols-4 border-t border-slate-200 bg-white md:hidden">
        <button v-for="item in mobileNavItems" :key="item.page" type="button" :class="['py-2 text-xs font-bold', currentPage === item.page ? 'text-blue-700' : 'text-slate-500']" @click="navigate(item.page)">
          <i :class="['fa-solid', item.icon, 'block text-base']"></i>{{ item.short }}
        </button>
      </nav>
    </section>

    <div v-if="toast" :class="['toast p-4', toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-950 text-white']">
      <div class="flex items-start gap-3">
        <i :class="['fa-solid mt-1', toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check']"></i>
        <div class="min-w-0">
          <div class="font-bold">{{ toast.title }}</div>
          <div class="text-sm opacity-90">{{ toast.message }}</div>
        </div>
        <button type="button" class="ml-auto" @click="toast = null"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <div v-if="loading && !initialLoading" class="fixed inset-0 z-50 flex items-center justify-center bg-white/45">
      <div class="panel flex items-center gap-3 p-4 font-bold"><span class="spinner"></span>Loading</div>
    </div>
  </div>
</script>

<script>
  const { createApp } = Vue;

  createApp({
    template: '#crm-template',
    data() {
      return {
        initialLoading: true,
        loading: false,
        accessDenied: false,
        accessDeniedMessage: 'You do not have permission to access MATCHPOINT CRM.',
        mobileMenuOpen: false,
        toast: null,
        auth: {},
        settings: {},
        permissions: {},
        customerTypes: [],
        priorities: [],
        workflowStates: [],
        statusFieldConfig: {},
        currentPage: 'dashboard',
        fieldErrors: {},
        users: [],
        dashboard: {
          kpis: {},
          recentProjects: [],
          topProjectsByValue: [],
          projectCountByStatus: {},
          projectValueByStatus: {},
          customerCountByType: {}
        },
        dashboardFilters: {
          fromDate: '',
          toDate: '',
          status: '',
          responsibleDept: '',
          salesOwner: '',
          customerType: '',
          industry: ''
        },
        charts: {},
        customerQuery: '',
        customerFilters: { customerType: '' },
        customers: { items: [], page: 1, pageSize: 25, total: 0, totalPages: 1 },
        customerPager: { page: 1, pageSize: 25 },
        customerForm: {},
        projectFilters: { query: '', status: '', responsibleDept: '' },
        projects: { items: [], page: 1, pageSize: 25, total: 0, totalPages: 1 },
        projectPager: { page: 1, pageSize: 25 },
        projectForm: {},
        customerOptions: [],
        libraries: [],
        selectedLibrary: '',
        libraryFiles: [],
        userForm: { Email: '', Role: 'Sales', FullName: '', Department: '', IsActive: true },
        settingsRows: [],
        auditFilters: { query: '', action: '', actorEmail: '', page: 1, pageSize: 25 },
        audit: { items: [], page: 1, pageSize: 25, total: 0, totalPages: 1 }
      };
    },
    computed: {
      navItems() {
        const items = [
          { page: 'dashboard', label: 'Dashboard', short: 'Home', icon: 'fa-chart-line' },
          { page: 'customers', label: 'Customers', short: 'Cust', icon: 'fa-building' },
          { page: 'projects', label: 'Projects', short: 'Proj', icon: 'fa-diagram-project' },
          { page: 'catalogues', label: 'Catalogues', short: 'Files', icon: 'fa-folder-open' }
        ];
        if (this.permissions.canManageUsers) items.push({ page: 'users', label: 'Users Admin', short: 'Users', icon: 'fa-users-gear' });
        if (this.permissions.canManageSettings) items.push({ page: 'settings', label: 'Settings', short: 'Set', icon: 'fa-gear' });
        if (this.permissions.canViewAuditLogs) items.push({ page: 'audit', label: 'Audit Logs', short: 'Audit', icon: 'fa-shield-halved' });
        return items;
      },
      mobileNavItems() {
        return this.navItems.slice(0, 4);
      },
      pageTitle() {
        const item = this.navItems.find(nav => nav.page === this.currentPage);
        if (item) return item.label;
        if (this.currentPage === 'customer-form') return this.customerForm.CustomerID ? 'Edit Customer' : 'New Customer';
        if (this.currentPage === 'project-form') return this.projectForm.ProjectID ? 'Edit Project' : 'New Project';
        return 'MATCHPOINT CRM';
      },
      dashboardCards() {
        const kpis = this.dashboard.kpis || {};
        return [
          { label: 'Total Projects', value: this.number(kpis.totalProjects), icon: 'fa-diagram-project', className: 'bg-blue-50 text-blue-700' },
          { label: 'Total Value', value: this.money(kpis.totalProjectValue), icon: 'fa-coins', className: 'bg-slate-100 text-slate-700' },
          { label: 'Open Pipeline', value: this.money(kpis.openPipelineValue), icon: 'fa-arrow-trend-up', className: 'bg-amber-50 text-amber-700' },
          { label: 'Expected Value', value: this.money(kpis.totalExpectedValue), icon: 'fa-bullseye', className: 'bg-blue-50 text-blue-700' },
          { label: 'Won Projects', value: this.number(kpis.wonProjects), icon: 'fa-circle-check', className: 'bg-green-50 text-green-700' },
          { label: 'Customers', value: this.number(kpis.totalCustomers), icon: 'fa-building', className: 'bg-slate-100 text-slate-700' }
        ];
      },
      currentStatusFields() {
        return this.statusFieldConfig[this.projectForm.Status] || [];
      }
    },
    mounted() {
      this.init();
    },
    methods: {
      apiCall(method, ...args) {
        return new Promise((resolve, reject) => {
          const runner = google.script.run
            .withSuccessHandler(response => {
              if (response && response.success) resolve(response.data);
              else reject(response || { code: 'UNKNOWN_ERROR', message: 'Unexpected response.' });
            })
            .withFailureHandler(error => {
              reject({ code: 'UNKNOWN_ERROR', message: error && error.message ? error.message : String(error) });
            });
          runner[method](...args);
        });
      },
      async rpc(method, ...args) {
        this.loading = true;
        try {
          return await this.apiCall(method, ...args);
        } catch (error) {
          this.handleError(error);
          throw error;
        } finally {
          this.loading = false;
        }
      },
      async init() {
        this.initialLoading = true;
        try {
          const data = await this.apiCall('getAuthData');
          this.auth = data.user || {};
          this.settings = data.settings || {};
          this.permissions = data.permissions || {};
          this.customerTypes = data.customerTypes || [];
          this.priorities = data.priorities || ['Low', 'Medium', 'High', 'Critical'];
          this.workflowStates = data.workflowStates || [];
          this.statusFieldConfig = data.statusFieldConfig || {};
          await this.loadUsers(false);
          await this.loadDashboard();
        } catch (error) {
          if (error && (error.code === 'ACCESS_DENIED' || error.code === 'UNAUTHENTICATED')) {
            this.accessDenied = true;
            this.accessDeniedMessage = error.message || this.accessDeniedMessage;
          } else {
            this.handleError(error);
          }
        } finally {
          this.initialLoading = false;
        }
      },
      handleError(error) {
        if (error && error.errors && error.errors.length) {
          this.fieldErrors = {};
          error.errors.forEach(item => {
            this.fieldErrors[item.field] = item.message;
          });
        }
        this.showToast('error', error && error.code ? error.code : 'Error', error && error.message ? error.message : 'Something went wrong.');
      },
      showToast(type, title, message) {
        this.toast = { type, title, message };
        window.setTimeout(() => {
          this.toast = null;
        }, 4500);
      },
      async navigate(page) {
        this.currentPage = page;
        this.mobileMenuOpen = false;
        this.fieldErrors = {};
        await this.refreshCurrent();
      },
      async refreshCurrent() {
        if (this.currentPage === 'dashboard') return this.loadDashboard();
        if (this.currentPage === 'customers') return this.loadCustomers(this.customers.page || 1);
        if (this.currentPage === 'projects') return this.loadProjects(this.projects.page || 1);
        if (this.currentPage === 'catalogues') return this.loadLibraries();
        if (this.currentPage === 'users') return this.loadUsers(true);
        if (this.currentPage === 'settings') return this.loadSettings();
        if (this.currentPage === 'audit') return this.loadAudit(this.audit.page || 1);
      },
      statusName(code) {
        const state = this.workflowStates.find(item => item.StateCode === code);
        return state ? state.StateName : code;
      },
      statusClass(code) {
        if (code === 'COMPLETED') return 'status-pill bg-green-50 text-green-700';
        if (code === 'CANCELLED') return 'status-pill bg-red-50 text-red-700';
        if (code === 'PROCUREMENT' || code === 'QUOTATION_SENT') return 'status-pill bg-amber-50 text-amber-700';
        return 'status-pill bg-blue-50 text-blue-700';
      },
      money(value) {
        return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', maximumFractionDigits: 0 }).format(Number(value || 0));
      },
      number(value) {
        return new Intl.NumberFormat('th-TH').format(Number(value || 0));
      },
      fieldError(field) {
        return this.fieldErrors[field] || '';
      },
      fieldClass(field) {
        return ['field', this.fieldErrors[field] ? 'field-error' : ''];
      },
      resetDashboardFilters() {
        this.dashboardFilters = { fromDate: '', toDate: '', status: '', responsibleDept: '', salesOwner: '', customerType: '', industry: '' };
        this.loadDashboard();
      },
      async loadDashboard() {
        this.dashboard = await this.rpc('getDashboard', this.dashboardFilters);
        this.$nextTick(() => this.renderCharts());
      },
      chartDataFromObject(object) {
        const labels = Object.keys(object || {});
        const values = labels.map(label => Number(object[label] || 0));
        return { labels: labels.length ? labels.map(label => this.statusName(label)) : ['No data'], values: values.length ? values : [0] };
      },
      renderCharts() {
        this.renderChart('statusCountChart', 'bar', this.dashboard.projectCountByStatus, 'Projects');
        this.renderChart('statusValueChart', 'bar', this.dashboard.projectValueByStatus, 'Value');
        this.renderChart('customerTypeChart', 'doughnut', this.dashboard.customerCountByType, 'Customers');
      },
      renderChart(id, type, source, label) {
        const el = document.getElementById(id);
        if (!el || !window.Chart) return;
        if (this.charts[id]) this.charts[id].destroy();
        const data = this.chartDataFromObject(source);
        this.charts[id] = new Chart(el, {
          type,
          data: {
            labels: data.labels,
            datasets: [{
              label,
              data: data.values,
              backgroundColor: ['#2563eb', '#16a34a', '#d97706', '#dc2626', '#7c3aed', '#0891b2', '#475569'],
              borderColor: '#ffffff',
              borderWidth: type === 'doughnut' ? 2 : 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } },
            scales: type === 'doughnut' ? {} : { y: { beginAtZero: true } }
          }
        });
      },
      async loadCustomers(page) {
        this.customerPager.page = page || this.customerPager.page || 1;
        this.customers = await this.rpc('searchCustomers', this.customerQuery, {
          page: this.customerPager.page,
          pageSize: this.customerPager.pageSize,
          customerType: this.customerFilters.customerType
        });
      },
      async loadCustomerOptions() {
        const result = await this.rpc('searchCustomers', '', { page: 1, pageSize: 100 });
        this.customerOptions = result.items || [];
      },
      newCustomer() {
        this.fieldErrors = {};
        this.customerForm = { CustomerType: '', OwnerEmail: this.auth.email, RowVersion: '' };
        if (this.permissions.canViewAll && !this.users.length) this.loadUsers(false);
        this.currentPage = 'customer-form';
      },
      async editCustomer(customerId) {
        this.fieldErrors = {};
        const customer = await this.rpc('getCustomer', customerId);
        this.customerForm = Object.assign({}, customer);
        if (this.permissions.canViewAll && !this.users.length) await this.loadUsers(false);
        this.currentPage = 'customer-form';
      },
      async saveCustomerForm() {
        this.fieldErrors = {};
        const saved = await this.rpc('saveCustomer', this.customerForm);
        this.customerForm = Object.assign({}, saved);
        this.showToast('success', 'Saved', 'Customer saved successfully.');
        this.currentPage = 'customers';
        await this.loadCustomers(1);
      },
      async removeCustomer(customerId) {
        if (!confirm('Delete this customer?')) return;
        await this.rpc('deleteCustomer', customerId);
        this.showToast('success', 'Deleted', 'Customer deleted.');
        await this.loadCustomers(this.customers.page || 1);
      },
      async loadProjects(page) {
        this.projectPager.page = page || this.projectPager.page || 1;
        this.projects = await this.rpc('searchProjects', this.projectFilters, {
          page: this.projectPager.page,
          pageSize: this.projectPager.pageSize
        });
      },
      async newProject() {
        this.fieldErrors = {};
        await Promise.all([this.loadCustomerOptions(), this.loadUsers(false)]);
        this.projectForm = {
          CustomerID: '',
          ProjectName: '',
          ResponsibleDept: '',
          AssignedSalesEmail: this.auth.email,
          ProjectValue: 0,
          Status: this.workflowStates[0] ? this.workflowStates[0].StateCode : 'LEAD_CONTACT',
          StatusDetails: {},
          ExpectedCloseDate: '',
          Priority: 'Medium',
          Probability: 20,
          Notes: ''
        };
        this.ensureStatusDetails();
        this.currentPage = 'project-form';
      },
      async editProject(projectId) {
        this.fieldErrors = {};
        await Promise.all([this.loadCustomerOptions(), this.loadUsers(false)]);
        const project = await this.rpc('getProject', projectId);
        this.projectForm = Object.assign({}, project, {
          StatusDetails: project.StatusDetailsObject || this.parseJson(project.StatusDetails)
        });
        this.ensureStatusDetails();
        this.currentPage = 'project-form';
      },
      ensureStatusDetails() {
        if (!this.projectForm.StatusDetails) this.projectForm.StatusDetails = {};
        this.currentStatusFields.forEach(field => {
          if (this.projectForm.StatusDetails[field.key] === undefined) this.projectForm.StatusDetails[field.key] = '';
        });
      },
      parseJson(value) {
        try {
          return value ? JSON.parse(value) : {};
        } catch (error) {
          return {};
        }
      },
      async saveProjectForm() {
        this.fieldErrors = {};
        const payload = Object.assign({}, this.projectForm, {
          StatusDetails: Object.assign({}, this.projectForm.StatusDetails)
        });
        const saved = await this.rpc('saveProject', payload);
        this.projectForm = Object.assign({}, saved, { StatusDetails: saved.StatusDetailsObject || {} });
        this.showToast('success', 'Saved', 'Project saved successfully.');
        this.currentPage = 'projects';
        await this.loadProjects(1);
      },
      async removeProject(projectId) {
        if (!confirm('Delete this project?')) return;
        await this.rpc('deleteProject', projectId);
        this.showToast('success', 'Deleted', 'Project deleted.');
        await this.loadProjects(this.projects.page || 1);
      },
      async loadLibraries() {
        this.libraries = await this.rpc('getConfiguredLibraries');
        if (!this.selectedLibrary && this.libraries.length) this.selectedLibrary = this.libraries[0].LibraryKey;
        if (this.selectedLibrary) await this.loadLibraryFiles();
      },
      async selectLibrary(libraryKey) {
        this.selectedLibrary = libraryKey;
        await this.loadLibraryFiles();
      },
      async loadLibraryFiles() {
        if (!this.selectedLibrary) return;
        const result = await this.rpc('getLibraryFiles', this.selectedLibrary);
        this.libraryFiles = result.files || [];
      },
      async loadUsers(showToast) {
        this.users = await this.rpc('getUsers');
        if (showToast) this.showToast('success', 'Loaded', 'Users loaded.');
      },
      editUser(person) {
        this.userForm = Object.assign({}, person);
      },
      async saveUserForm() {
        await this.rpc('saveUser', this.userForm);
        this.userForm = { Email: '', Role: 'Sales', FullName: '', Department: '', IsActive: true };
        this.showToast('success', 'Saved', 'User saved successfully.');
        await this.loadUsers(false);
      },
      async removeUser(email) {
        if (!confirm('Deactivate this user?')) return;
        await this.rpc('deleteUser', email);
        this.showToast('success', 'Updated', 'User deactivated.');
        await this.loadUsers(false);
      },
      async loadSettings() {
        this.settingsRows = await this.rpc('getSettings');
      },
      async saveSettingRow(setting) {
        await this.rpc('saveSetting', setting.Key, setting.Value);
        this.showToast('success', 'Saved', 'Setting saved.');
        await this.loadSettings();
      },
      async loadAudit(page) {
        this.auditFilters.page = page || this.auditFilters.page || 1;
        this.audit = await this.rpc('getAuditLogs', this.auditFilters);
      }
    }
  }).mount('#app');
</script>
